name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html robots.txt .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes can't see the just-uploaded artifact yet (2026-11-14): wait and try once more
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
